
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React 정적 파일
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 챗봇 서비스 프록시. /api/보다 구체적인 경로라 챗봇 요청만 이쪽으로 온다.
    # 변수로 지정하고 resolver를 두면 Nginx가 시작할 때가 아니라 요청이 올 때 이름을 찾는다.
    # (고정 호스트로 쓰면 챗봇 서비스가 없을 때 Nginx가 시작하지 못해 프론트 전체가 멈춘다)
    location /api/chat/ {
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        set $chatbot http://momfit-chatbot.team.svc.cluster.local:8100;
        proxy_pass $chatbot;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # 답변 생성(LLM 호출)에 수 초가 걸릴 수 있다.
        proxy_read_timeout 60s;
    }

    # FastAPI 백엔드 프록시
    location /api/ {
        proxy_pass http://momfit-backend.team.svc.cluster.local:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Vite 정적 에셋 캐싱
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML 캐시 방지
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
